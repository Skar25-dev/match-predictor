{# Desplegable de equipos agrupado por división. Variables: field, selected, empty #}
<select name="{{ field }}" required>
  <option value="">{{ empty }}</option>
  {% for division, names in teams.items() %}
    <optgroup label="{{ division | division_name }}">
      {% for name in names %}
        <option value="{{ name }}" {% if name == selected %}selected{% endif %}>{{ name | team_name }}</option>
      {% endfor %}
    </optgroup>
  {% endfor %}
</select>
