name: Registro diario de predicciones

# Cada día descarga resultados y calendario, guarda las predicciones de los partidos que aún
# no se han jugado y actualiza data/live_predictions.csv. Una predicción ya guardada nunca se
# reescribe. También se puede lanzar a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar resultados y calendario
        run: |
          python -m matchpredictor.data.download
          python -m matchpredictor.data.download --fixtures

      - name: Guardar predicciones nuevas
        run: python -m matchpredictor.evaluation.predictions_log record --log data/live_predictions.csv

      - name: Comparar con los resultados
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m matchpredictor.evaluation.predictions_log report --log data/live_predictions.csv | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el registro en el repositorio
        run: |
          if [ -n "$(git status --porcelain data/live_predictions.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live_predictions.csv
            git commit -m "Registro: predicciones del $(date -u +%F)"
            git push
          else
            echo "Sin predicciones nuevas."
          fi
